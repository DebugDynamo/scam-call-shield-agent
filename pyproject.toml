[project]
name = "repo-voice-ai"
version = "0.1.0"
description = "Domain-neutral real-time voice AI platform (Pipecat + FastAPI)"
requires-python = ">=3.12"
dependencies = [
    "pipecat-ai[google,sarvam,elevenlabs,silero,webrtc,runner]>=1.14",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "jsonschema>=4.22",
    "httpx>=0.27",
    "loguru>=0.7",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "pytest-timeout>=2.3", "ruff>=0.6"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
timeout = 60
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
